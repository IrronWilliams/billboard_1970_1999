services:
  node:
    image: billboardrankings-node
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  web:
    image: billboardrankings-web
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - node
    restart: unless-stopped
