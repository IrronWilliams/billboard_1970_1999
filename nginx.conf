gzip on;
gzip_types text/css application/javascript image/svg+xml text/plain application/json;
gzip_min_length 1024;

server {
    listen 80;

    # HTML — revalidate on every request
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Static assets — revalidate on every request (dev-friendly)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://node:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        return 301 /billboard70_99.html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}
