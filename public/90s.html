<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altitude 99 — 90s Live Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Teko:wght@500;600&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #060a0d;
      --card-bg:    #0e1418;
      --card-edge:  #243040;
      --teal:       #00b8c8;
      --teal-dark:  #007888;
      --teal-dim:   #003844;
      --lime:       #aacc22;
      --silver:     #8898a8;
      --silver-lt:  #c8d8e4;
      --text:       #c8dce8;
      --muted:      #3a5060;
      --dim:        #162028;
      --lcd-bg:     #030c0a;
      --lcd-green:  #00dd88;
      --red-down:   #cc3322;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        /* Monitor-top glow */
        radial-gradient(ellipse 60% 25% at 50% 0%, rgba(0,184,200,0.07) 0%, transparent 70%),
        /* Dot grid — very 90s graphic design */
        radial-gradient(circle, rgba(0,184,200,0.07) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Rajdhani', sans-serif;
    }

    /* ── CARD ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      padding: 28px 24px 22px;
      /* Brushed-metal horizontal lines + dark gradient */
      background-image:
        repeating-linear-gradient(180deg,
          transparent 0px, transparent 1px,
          rgba(255,255,255,0.014) 1px, rgba(255,255,255,0.014) 2px),
        linear-gradient(170deg, #161e26 0%, #0e1418 55%, #0a1016 100%);
      border: 1px solid var(--card-edge);
      box-shadow:
        0 0 0 1px #040608,
        inset 0 1px 0 rgba(200,216,228,0.07),
        0 24px 60px rgba(0,0,0,0.75);
      z-index: 1;
    }

    /* Teal accent strip at top — like a CD player LED bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      border-radius: 0 0 2px 2px;
    }

    /* ── LIVE BADGE ── */
    .live-badge {
      position: absolute;
      top: 12px; right: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,184,200,0.08);
      border: 1px solid rgba(0,184,200,0.5);
      border-radius: 3px;
      padding: 3px 8px;
      font-family: 'VT323', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      color: var(--teal);
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 5px var(--teal);
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.25; transform: scale(0.45); }
    }

    /* ── STATION ── */
    .station {
      text-align: center;
      margin-bottom: 20px;
    }

    .station-name {
      font-family: 'Teko', sans-serif;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--teal);
      text-shadow: 0 0 12px rgba(0,184,200,0.45);
      line-height: 1;
    }

    .station-sub {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── MEDIA ROW ── */
    .media-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    /* ── COMPACT DISC ── */
    .cd {
      flex-shrink: 0;
      width: 152px; height: 152px;
      border-radius: 50%;
      position: relative;
      /* Concentric track rings + rainbow iridescence + silver base */
      background:
        radial-gradient(circle at 34% 28%,
          rgba(255,255,255,0.65) 0%,
          transparent 38%),
        conic-gradient(
          rgba(210,60,60,0.42)    0deg,
          rgba(210,180,0,0.42)   40deg,
          rgba(40,190,80,0.42)   80deg,
          rgba(0,170,220,0.42)  130deg,
          rgba(60,20,220,0.42)  180deg,
          rgba(190,0,200,0.42)  220deg,
          rgba(210,60,60,0.42)  270deg,
          rgba(210,180,0,0.42)  310deg,
          rgba(40,190,80,0.42)  360deg
        ),
        repeating-radial-gradient(
          circle at center,
          transparent 0px, transparent 3px,
          rgba(0,0,0,0.045) 3px, rgba(0,0,0,0.045) 4px
        ),
        radial-gradient(circle,
          #f2f4f8 0%,
          #dce2ea 30%,
          #bcc4ce 62%,
          #8c96a4 100%);
      box-shadow:
        0 0 0 1.5px #505860,
        0 6px 26px rgba(0,0,0,0.65),
        inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .cd.spinning { animation: spin 3s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Transparent hub ring */
    .cd::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 62px; height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 0%, transparent 50%,
        rgba(160,180,200,0.18) 50%, rgba(160,180,200,0.18) 60%,
        transparent 60%);
      pointer-events: none;
    }

    /* Center label (printed side) */
    .cd-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      border-radius: 50%;
      background: linear-gradient(140deg, #0c1c28 0%, #081418 100%);
      border: 1px solid rgba(0,184,200,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cd-label::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        rgba(0,184,200,0.12) 0%,
        transparent 60%);
    }

    .cd-label-text {
      font-family: 'Teko', sans-serif;
      font-size: 0.48rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--teal);
      text-align: center;
      line-height: 1.2;
      position: relative;
      z-index: 1;
    }

    /* Spindle hole */
    .cd-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #040608;
      border: 0.5px solid #2a3040;
      z-index: 2;
    }

    /* ── ARTIST PHOTO ── */
    .artist-photo {
      flex-shrink: 0;
      width: 112px; height: 112px;
      border-radius: 6px;
      border: 1px solid var(--card-edge);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px #040608,
        inset 0 0 0 1px rgba(0,184,200,0.12),
        0 6px 20px rgba(0,0,0,0.65);
    }

    .artist-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .artist-photo-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #0a1c28 0%, #060c12 100%);
    }

    .artist-initials {
      font-family: 'Teko', sans-serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--teal);
      text-shadow: 0 0 12px rgba(0,184,200,0.5);
      letter-spacing: 0.06em;
    }

    .artist-photo-sub {
      font-size: 0.48rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-top: 5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Teal corner marks */
    .artist-photo::before,
    .artist-photo::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      pointer-events: none;
    }
    .artist-photo::before {
      top: 0; left: 0;
      border-top: 1.5px solid var(--teal);
      border-left: 1.5px solid var(--teal);
    }
    .artist-photo::after {
      bottom: 0; right: 0;
      border-bottom: 1.5px solid var(--silver);
      border-right: 1.5px solid var(--silver);
    }

    /* ── SONG INFO ── */
    .song-info {
      text-align: center;
      margin-bottom: 16px;
    }

    .song-title {
      font-family: 'Teko', sans-serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .artist-name {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .song-year {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── QUALITY PANEL (LCD-style) ── */
    .quality-panel {
      display: flex;
      align-items: stretch;
      gap: 0;
      background: var(--lcd-bg);
      border: 1px solid #0a1c18;
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    }

    .ql-block {
      flex: 1;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ql-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: rgba(0,221,136,0.5);
      text-transform: uppercase;
    }

    .ql-value {
      font-family: 'VT323', monospace;
      font-size: 0.82rem;
      color: var(--lcd-green);
      letter-spacing: 0.05em;
      text-shadow: 0 0 6px rgba(0,221,136,0.4);
      white-space: nowrap;
    }

    .ql-sep {
      width: 1px;
      background: #0e2820;
      flex-shrink: 0;
      margin: 6px 0;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0,184,200,0.4),
        rgba(170,204,34,0.3),
        transparent);
      margin: 14px 0;
    }

    /* ── WAVEFORM ── */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 38px;
      margin-bottom: 18px;
    }

    .wave-bar {
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(to top, var(--teal-dark), var(--teal));
      height: 4px;
    }

    /* Alternate bars get a lime tint */
    .wave-bar:nth-child(even) {
      background: linear-gradient(to top, var(--teal), var(--lime));
    }

    .waveform.playing .wave-bar {
      animation-name: wave;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .waveform.playing .wave-bar:nth-child(1)  { animation-duration: .80s; animation-delay: .00s; }
    .waveform.playing .wave-bar:nth-child(2)  { animation-duration: .65s; animation-delay: .10s; }
    .waveform.playing .wave-bar:nth-child(3)  { animation-duration: .90s; animation-delay: .05s; }
    .waveform.playing .wave-bar:nth-child(4)  { animation-duration: .72s; animation-delay: .20s; }
    .waveform.playing .wave-bar:nth-child(5)  { animation-duration: .85s; animation-delay: .15s; }
    .waveform.playing .wave-bar:nth-child(6)  { animation-duration: .70s; animation-delay: .08s; }
    .waveform.playing .wave-bar:nth-child(7)  { animation-duration: .95s; animation-delay: .25s; }
    .waveform.playing .wave-bar:nth-child(8)  { animation-duration: .75s; animation-delay: .12s; }
    .waveform.playing .wave-bar:nth-child(9)  { animation-duration: .88s; animation-delay: .18s; }
    .waveform.playing .wave-bar:nth-child(10) { animation-duration: .68s; animation-delay: .22s; }
    .waveform.playing .wave-bar:nth-child(11) { animation-duration: .82s; animation-delay: .06s; }
    .waveform.playing .wave-bar:nth-child(12) { animation-duration: .78s; animation-delay: .14s; }
    .waveform.playing .wave-bar:nth-child(13) { animation-duration: .92s; animation-delay: .09s; }
    .waveform.playing .wave-bar:nth-child(14) { animation-duration: .66s; animation-delay: .19s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50%       { height: 30px; }
    }

    /* ── PLAY BUTTON ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .play-btn {
      width: 68px; height: 68px;
      border-radius: 50%;
      border: 2px solid var(--teal);
      background: linear-gradient(145deg, #0e2030 0%, #081418 100%);
      color: var(--teal);
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow:
        0 0 0 1px rgba(0,184,200,0.2),
        0 0 16px rgba(0,184,200,0.3),
        0 0 36px rgba(0,184,200,0.1),
        0 5px 18px rgba(0,0,0,0.6);
    }

    .play-btn:hover {
      background: linear-gradient(145deg, #163040 0%, #0c1e2c 100%);
      box-shadow:
        0 0 0 1px rgba(0,184,200,0.35),
        0 0 24px rgba(0,184,200,0.5),
        0 0 50px rgba(0,184,200,0.15),
        0 5px 22px rgba(0,0,0,0.6);
      transform: scale(1.06);
    }

    .play-btn:active { transform: scale(0.95); }
    .play-btn.state-play  { padding-left: 4px; }
    .play-btn.state-pause { padding-left: 0; }

    /* ── VOLUME ── */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .speaker-icon {
      font-size: 1rem;
      min-width: 22px;
      text-align: center;
      transition: opacity 0.3s;
    }

    .speaker-icon.dim { opacity: 0.22; }

    input[type=range] {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 2px;
      cursor: pointer;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--teal);
      border: 2px solid var(--silver-lt);
      box-shadow: 0 0 7px var(--teal);
      cursor: pointer;
    }

    input[type=range]::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--teal);
      border: 2px solid var(--silver-lt);
      box-shadow: 0 0 7px var(--teal);
      cursor: pointer;
    }

    .vol-pct {
      font-family: 'VT323', monospace;
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 38px;
      text-align: right;
      letter-spacing: 0.04em;
    }

    /* ── RATING ── */
    .rating-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rating-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      flex: 1;
    }

    .rating-btns { display: flex; gap: 10px; }

    .thumb-btn {
      position: relative;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--dim);
      background: rgba(4,8,12,0.7);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .thumb-btn:hover {
      border-color: var(--teal);
      color: var(--text);
      box-shadow: 0 0 10px rgba(0,184,200,0.3);
      transform: scale(1.08);
    }

    .thumb-btn:active { transform: scale(0.93); }

    .thumb-btn.voted-up {
      background: rgba(170,204,34,0.1);
      border-color: var(--lime);
      color: var(--lime);
      box-shadow: 0 0 12px rgba(170,204,34,0.3);
    }

    .thumb-btn.voted-down {
      background: rgba(204,51,34,0.1);
      border-color: var(--red-down);
      color: #ee4433;
      box-shadow: 0 0 12px rgba(204,51,34,0.3);
    }

    .vote-count {
      position: absolute;
      top: -6px; right: -6px;
      min-width: 17px; height: 17px;
      border-radius: 9px;
      background: var(--teal);
      color: #040810;
      font-family: 'VT323', monospace;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .vote-count.show { opacity: 1; }

    /* ── STATUS ── */
    .status-bar {
      text-align: center;
      margin-top: 12px;
      font-family: 'VT323', monospace;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      min-height: 1em;
      text-transform: uppercase;
    }

    /* ── FOOTER ── */
    .card-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: #162028;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>

  <!-- Station -->
  <div class="station">
    <div class="station-name">ALTITUDE 99</div>
    <div class="station-sub">Billboard Top 100 &bull; The 1990s</div>
  </div>

  <!-- CD + Artist Photo -->
  <div class="media-row">

    <div class="cd" id="record">
      <div class="cd-label">
        <div class="cd-label-text">ALT<br>99</div>
      </div>
      <div class="cd-hole"></div>
    </div>

    <div class="artist-photo">
      <!-- Replace placeholder with <img src="..." alt="Artist"> when a photo is available -->
      <div class="artist-photo-placeholder">
        <div class="artist-initials">TLC</div>
        <div class="artist-photo-sub">Artist</div>
      </div>
    </div>

  </div>

  <!-- Song Info -->
  <div class="song-info">
    <div class="song-title" id="songTitle">Waterfalls</div>
    <div class="artist-name" id="artistName">TLC</div>
    <div class="song-year" id="songYear">&bull;&nbsp;1995&nbsp;&bull;</div>
  </div>

  <!-- Stream Quality Panel -->
  <div class="quality-panel">
    <div class="ql-block">
      <div class="ql-label">Source</div>
      <div class="ql-value">LOSSLESS HLS</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Quality</div>
      <div class="ql-value">CD QUALITY</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Sample Rate</div>
      <div class="ql-value">44.1 kHz</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Channels</div>
      <div class="ql-value">STEREO</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
  </div>

  <!-- Play / Pause -->
  <div class="controls">
    <button class="play-btn state-play" id="playBtn" title="Play / Pause">&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span class="speaker-icon" id="speakerIcon">🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    <span class="vol-pct" id="volPct">100%</span>
  </div>

  <div class="divider"></div>

  <!-- Rating -->
  <div class="rating-section">
    <div class="rating-label">Rate this song</div>
    <div class="rating-btns">
      <button class="thumb-btn" id="thumbUp" title="Love it">
        👍
        <span class="vote-count" id="upCount"></span>
      </button>
      <button class="thumb-btn" id="thumbDown" title="Not for me">
        👎
        <span class="vote-count" id="downCount"></span>
      </button>
    </div>
  </div>

  <div class="status-bar" id="status">Press play to connect</div>

  <div class="card-footer">Billboard &bull; Top 100 &bull; 1990 – 1999</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script>
  const STREAM = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';

  const audio     = new Audio();
  const record    = document.getElementById('record');
  const waveform  = document.getElementById('waveform');
  const playBtn   = document.getElementById('playBtn');
  const statusEl  = document.getElementById('status');
  const volSlider = document.getElementById('volSlider');
  const volPct    = document.getElementById('volPct');
  const speakerEl = document.getElementById('speakerIcon');
  const thumbUp   = document.getElementById('thumbUp');
  const thumbDown = document.getElementById('thumbDown');
  const upCount   = document.getElementById('upCount');
  const downCount = document.getElementById('downCount');

  let isPlaying = false;
  let hlsReady  = false;
  let upVotes   = 0;
  let downVotes = 0;
  let userVote  = null; // 'up' | 'down' | null

  // ── HLS INIT ──
  (function initHls() {
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.loadSource(STREAM);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hlsReady = true;
        setStatus('Stream ready — lossless HLS locked');
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) setStatus('Stream error — retrying...');
      });
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      audio.src = STREAM;
      hlsReady  = true;
      setStatus('Stream ready — lossless HLS locked');
    } else {
      setStatus('HLS not supported in this browser');
    }
  })();

  // ── PLAY / PAUSE ──
  playBtn.addEventListener('click', () => {
    if (!hlsReady) { setStatus('Buffering stream...'); return; }
    if (isPlaying) {
      audio.pause();
      setPlayState(false);
    } else {
      audio.play()
        .then(() => setPlayState(true))
        .catch(() => setStatus('Playback blocked — try again'));
    }
  });

  function setPlayState(playing) {
    isPlaying = playing;
    if (playing) {
      playBtn.innerHTML = '&#9646;&#9646;';
      playBtn.classList.replace('state-play', 'state-pause');
      record.classList.add('spinning');
      waveform.classList.add('playing');
      setStatus('Live &bull; CD quality stream');
    } else {
      playBtn.innerHTML = '&#9654;';
      playBtn.classList.replace('state-pause', 'state-play');
      record.classList.remove('spinning');
      waveform.classList.remove('playing');
      setStatus('Paused');
    }
  }

  // ── VOLUME ──
  function syncVolume() {
    const v   = parseFloat(volSlider.value);
    const pct = Math.round(v * 100);
    audio.volume = v;
    volPct.textContent = pct + '%';

    volSlider.style.background =
      `linear-gradient(90deg, #00b8c8 ${pct}%, #162028 ${pct}%)`;

    if (pct === 0) {
      speakerEl.textContent = '🔇';
      speakerEl.classList.add('dim');
    } else if (pct < 35) {
      speakerEl.textContent = '🔉';
      speakerEl.classList.add('dim');
    } else {
      speakerEl.textContent = '🔊';
      speakerEl.classList.remove('dim');
    }
  }

  volSlider.addEventListener('input', syncVolume);
  syncVolume();

  // ── RATING ──
  thumbUp.addEventListener('click', () => {
    if (userVote === 'up') {
      upVotes--;
      userVote = null;
      thumbUp.classList.remove('voted-up');
    } else {
      if (userVote === 'down') {
        downVotes = Math.max(0, downVotes - 1);
        thumbDown.classList.remove('voted-down');
      }
      upVotes++;
      userVote = 'up';
      thumbUp.classList.add('voted-up');
    }
    renderVotes();
  });

  thumbDown.addEventListener('click', () => {
    if (userVote === 'down') {
      downVotes--;
      userVote = null;
      thumbDown.classList.remove('voted-down');
    } else {
      if (userVote === 'up') {
        upVotes = Math.max(0, upVotes - 1);
        thumbUp.classList.remove('voted-up');
      }
      downVotes++;
      userVote = 'down';
      thumbDown.classList.add('voted-down');
    }
    renderVotes();
  });

  function renderVotes() {
    upCount.textContent   = upVotes;
    downCount.textContent = downVotes;
    upCount.classList.toggle('show',   upVotes   > 0);
    downCount.classList.toggle('show', downVotes > 0);
  }

  function setStatus(msg) { statusEl.innerHTML = msg; }
</script>

</body>
</html>
