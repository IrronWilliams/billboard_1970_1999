<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altitude 99 — 90s Live Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Teko:wght@500;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="90s.css">
</head>
<body>

<div class="card">

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>

  <!-- Station -->
  <div class="station">
    <div class="station-name">ALTITUDE 99</div>
    <div class="station-sub">Billboard Top 100 &bull; The 1990s</div>
  </div>

  <!-- CD + Artist Photo -->
  <div class="media-row">

    <div class="cd" id="record">
      <div class="cd-label">
        <div class="cd-label-text">ALT<br>99</div>
      </div>
      <div class="cd-hole"></div>
    </div>

    <div class="artist-photo">
      <!-- Replace placeholder with <img src="..." alt="Artist"> when a photo is available -->
      <div class="artist-photo-placeholder">
        <div class="artist-initials">TLC</div>
        <div class="artist-photo-sub">Artist</div>
      </div>
    </div>

  </div>

  <!-- Song Info -->
  <div class="song-info">
    <div class="song-title" id="songTitle">Waterfalls</div>
    <div class="artist-name" id="artistName">TLC</div>
    <div class="song-year" id="songYear">&bull;&nbsp;1995&nbsp;&bull;</div>
  </div>

  <!-- Stream Quality Panel -->
  <div class="quality-panel">
    <div class="ql-block">
      <div class="ql-label">Source</div>
      <div class="ql-value">LOSSLESS HLS</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Quality</div>
      <div class="ql-value">CD QUALITY</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Sample Rate</div>
      <div class="ql-value">44.1 kHz</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Channels</div>
      <div class="ql-value">STEREO</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
  </div>

  <!-- Play / Pause -->
  <div class="controls">
    <button class="play-btn state-play" id="playBtn" title="Play / Pause">&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span class="speaker-icon" id="speakerIcon">🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    <span class="vol-pct" id="volPct">100%</span>
  </div>

  <div class="divider"></div>

  <!-- Rating -->
  <div class="rating-section">
    <div class="rating-label">Rate this song</div>
    <div class="rating-btns">
      <button class="thumb-btn" id="thumbUp" title="Love it">
        👍
        <span class="vote-count" id="upCount"></span>
      </button>
      <button class="thumb-btn" id="thumbDown" title="Not for me">
        👎
        <span class="vote-count" id="downCount"></span>
      </button>
    </div>
  </div>

  <div class="status-bar" id="status">Press play to connect</div>

  <div class="card-footer">Billboard &bull; Top 100 &bull; 1990 – 1999</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="90s.js"></script>

</body>
</html>
