<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power 80s — Live Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="80s.css">
</head>
<body>

<div class="card">

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>

  <!-- Station -->
  <div class="station">
    <div class="station-name">POWER 80s</div>
    <div class="station-sub">Billboard Top 100 &bull; The 1980s</div>
  </div>

  <!-- Cassette + Artist Photo -->
  <div class="media-row">

    <div class="cassette" id="record">
      <!-- Corner screws -->
      <div class="screw" style="top:4px;left:4px"></div>
      <div class="screw" style="top:4px;right:4px"></div>
      <div class="screw" style="bottom:4px;left:4px"></div>
      <div class="screw" style="bottom:4px;right:4px"></div>
      <!-- Bottom-center screw -->
      <div class="screw" style="bottom:4px;left:50%;transform:translateX(-50%)"></div>

      <!-- Label sticker -->
      <div class="cassette-label">
        <div class="label-station">POWER 80s</div>
        <div class="label-meta">SIDE &#9654; A &nbsp;&bull;&nbsp; 46 MIN</div>
      </div>

      <!-- Tape window with spinning reels -->
      <div class="cassette-window">
        <div class="reel reel-l"><div class="reel-hub"></div></div>
        <div class="reel reel-r"><div class="reel-hub"></div></div>
        <div class="tape-strip"></div>
      </div>
    </div>

    <div class="artist-photo">
      <!-- Replace the placeholder below with <img src="..." alt="Artist"> when a photo is available -->
      <div class="artist-photo-placeholder">
        <div class="artist-initials">MJ</div>
        <div class="artist-photo-sub">Artist</div>
      </div>
    </div>

  </div>

  <!-- Song Info -->
  <div class="song-info">
    <div class="song-title" id="songTitle">Billie Jean</div>
    <div class="artist-name" id="artistName">Michael Jackson</div>
    <div class="song-year" id="songYear">&bull;&nbsp;1983&nbsp;&bull;</div>
  </div>

  <!-- Stream Quality Panel -->
  <div class="quality-panel">
    <div class="ql-block">
      <div class="ql-label">Source</div>
      <div class="ql-value">LOSSLESS HLS</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Quality</div>
      <div class="ql-value">CD QUALITY</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Sample Rate</div>
      <div class="ql-value">44.1 kHz</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Channels</div>
      <div class="ql-value">STEREO</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
  </div>

  <!-- Play / Pause -->
  <div class="controls">
    <button class="play-btn state-play" id="playBtn" title="Play / Pause">&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span class="speaker-icon" id="speakerIcon">🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    <span class="vol-pct" id="volPct">100%</span>
  </div>

  <div class="divider"></div>

  <!-- Rating -->
  <div class="rating-section">
    <div class="rating-label">Rate this song</div>
    <div class="rating-btns">
      <button class="thumb-btn" id="thumbUp" title="Love it">
        👍
        <span class="vote-count" id="upCount"></span>
      </button>
      <button class="thumb-btn" id="thumbDown" title="Not for me">
        👎
        <span class="vote-count" id="downCount"></span>
      </button>
    </div>
  </div>

  <div class="status-bar" id="status">Click play to engage</div>

  <div class="card-footer">Billboard &bull; Top 100 &bull; 1980 – 1989</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="80s.js"></script>

</body>
</html>
