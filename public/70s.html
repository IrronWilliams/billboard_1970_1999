<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovy FM — 70s Live Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Bebas+Neue&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="70s.css">
</head>
<body>

<div class="card">

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>

  <!-- Station -->
  <div class="station">
    <div class="station-name">Groovy FM</div>
    <div class="station-sub">Billboard Top 100 &bull; The 1970s</div>
  </div>

  <!-- Record + Artist Photo -->
  <div class="media-row">

    <div class="record" id="record">
      <div class="record-label">
        <div class="record-label-text">GROOVY<br>FM</div>
        <div class="record-hole"></div>
      </div>
    </div>

    <div class="artist-photo">
      <!-- Swap the placeholder div for an <img> tag if you have an artist photo URL -->
      <div class="artist-photo-placeholder">
        <div class="artist-initials" id="artistInitials">EW&amp;F</div>
        <div class="artist-photo-sub">Artist</div>
      </div>
    </div>

  </div>

  <!-- Song Info -->
  <div class="song-info">
    <div class="song-title" id="songTitle">September</div>
    <div class="artist-name" id="artistName">Earth, Wind &amp; Fire</div>
    <div class="song-year" id="songYear">&bull;&nbsp;1978&nbsp;&bull;</div>
  </div>

  <!-- Stream Quality Panel -->
  <div class="quality-panel">
    <div class="ql-block">
      <div class="ql-label">Source</div>
      <div class="ql-value">LOSSLESS HLS</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Quality</div>
      <div class="ql-value">CD QUALITY</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Sample Rate</div>
      <div class="ql-value">44.1 kHz</div>
    </div>
    <div class="ql-sep"></div>
    <div class="ql-block">
      <div class="ql-label">Channels</div>
      <div class="ql-value">STEREO</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
  </div>

  <!-- Play / Pause -->
  <div class="controls">
    <button class="play-btn state-play" id="playBtn" title="Play / Pause">&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span class="speaker-icon" id="speakerIcon">🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    <span class="vol-pct" id="volPct">100%</span>
  </div>

  <div class="divider"></div>

  <!-- Rating -->
  <div class="rating-section">
    <div class="rating-label">Rate this song</div>
    <div class="rating-btns">
      <button class="thumb-btn" id="thumbUp" title="Love it">
        👍
        <span class="vote-count" id="upCount"></span>
      </button>
      <button class="thumb-btn" id="thumbDown" title="Not for me">
        👎
        <span class="vote-count" id="downCount"></span>
      </button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status">Click play to start the groove</div>

  <div class="card-footer">Billboard &bull; Top 100 &bull; 1970 – 1979</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="70s.js"></script>

</body>
</html>
