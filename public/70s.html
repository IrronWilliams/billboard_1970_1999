<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovy FM — 70s Live Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Bebas+Neue&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0f0700;
      --card-bg:    #1e0e00;
      --card-edge:  #5a3200;
      --gold:       #c8890a;
      --gold-lt:    #f0b429;
      --orange:     #d95c0a;
      --orange-lt:  #f07030;
      --cream:      #f5e2b8;
      --muted:      #8a6a40;
      --dim:        #3d2000;
      --red-live:   #dd3030;
      --green-up:   #5aaa28;
      --red-down:   #cc3820;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -10%, #3a1a00 0%, #0f0700 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Oswald', sans-serif;
    }

    /* ── CARD ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      padding: 30px 26px 24px;
      /* Wood-grain layers */
      background-image:
        repeating-linear-gradient(91deg,
          transparent 0px, transparent 2px,
          rgba(255,255,255,0.014) 2px, rgba(255,255,255,0.014) 3px),
        repeating-linear-gradient(180deg,
          transparent 0px, transparent 22px,
          rgba(0,0,0,0.07) 22px, rgba(0,0,0,0.07) 24px),
        linear-gradient(175deg, #3a1c00 0%, #251000 50%, #1a0900 100%);
      border: 2px solid var(--card-edge);
      box-shadow:
        0 0 0 1px #000,
        inset 0 1px 0 rgba(255,200,80,0.07),
        0 0 50px rgba(200,137,10,0.12),
        0 20px 60px rgba(0,0,0,0.7);
    }

    /* Outer decorative border */
    .card::before {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 14px;
      border: 1px solid rgba(200,137,10,0.12);
      pointer-events: none;
    }

    /* ── LIVE BADGE ── */
    .live-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(220,48,48,0.12);
      border: 1px solid rgba(221,48,48,0.6);
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: #f07070;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red-live);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.55); }
    }

    /* ── STATION TITLE ── */
    .station {
      text-align: center;
      margin-bottom: 22px;
    }

    .station-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      color: var(--gold-lt);
      text-shadow: 0 0 22px rgba(240,180,41,0.45);
      line-height: 1;
    }

    .station-sub {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── MEDIA ROW: record + artist photo ── */
    .media-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    /* ── VINYL RECORD ── */
    .record {
      flex-shrink: 0;
      width: 152px;
      height: 152px;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%,
          #272727 0%,  #181818 11%,
          #232323 12%, #161616 24%,
          #222222 25%, #151515 37%,
          #212121 38%, #141414 50%,
          #202020 51%, #141414 63%,
          #1f1f1f 64%, #131313 76%,
          #1e1e1e 77%, #121212 89%,
          #181818 90%, #111111 100%);
      box-shadow:
        0 0 0 2px #0a0a0a,
        0 8px 30px rgba(0,0,0,0.85),
        inset 0 1px 2px rgba(255,255,255,0.04);
    }

    /* Shine */
    .record::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(130deg,
        rgba(255,255,255,0.07) 0%,
        transparent 45%,
        rgba(0,0,0,0.25) 100%);
      pointer-events: none;
    }

    .record.spinning {
      animation: spin 2.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Center label */
    .record-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      border-radius: 50%;
      background: conic-gradient(
        var(--orange)    0deg,
        var(--gold)    100deg,
        #a84000        200deg,
        var(--gold-lt) 280deg,
        var(--orange)  360deg
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
    }

    .record-label-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.42rem;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.9);
      text-align: center;
      line-height: 1.15;
      z-index: 1;
    }

    /* Spindle hole */
    .record-hole {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #0a0a0a;
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
      z-index: 2;
    }

    /* ── ARTIST PHOTO ── */
    .artist-photo {
      flex-shrink: 0;
      width: 118px;
      height: 118px;
      border-radius: 10px;
      border: 2px solid var(--gold);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px #000,
        0 6px 20px rgba(0,0,0,0.65);
    }

    .artist-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Placeholder when no image */
    .artist-photo-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #3a1900 0%, #150800 100%);
    }

    .artist-initials {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--gold-lt);
      text-shadow: 0 0 16px rgba(240,180,41,0.5);
    }

    .artist-photo-sub {
      font-size: 0.48rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* Gold corner marks */
    .artist-photo::before,
    .artist-photo::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      pointer-events: none;
    }
    .artist-photo::before {
      top: 0; left: 0;
      border-top: 2px solid var(--gold-lt);
      border-left: 2px solid var(--gold-lt);
    }
    .artist-photo::after {
      bottom: 0; right: 0;
      border-bottom: 2px solid var(--gold-lt);
      border-right: 2px solid var(--gold-lt);
    }

    /* ── SONG INFO ── */
    .song-info {
      text-align: center;
      margin-bottom: 18px;
    }

    .song-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--cream);
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .artist-name {
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--gold-lt);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .song-year {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--muted);
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,137,10,0.45), transparent);
      margin: 14px 0;
    }

    /* ── WAVEFORM ── */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 38px;
      margin-bottom: 18px;
    }

    .wave-bar {
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(to top, var(--orange), var(--gold-lt));
      height: 4px;
    }

    /* Each bar gets a unique animation when .playing */
    .waveform.playing .wave-bar { animation-name: wave; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .waveform.playing .wave-bar:nth-child(1)  { animation-duration:.80s; animation-delay:.00s; }
    .waveform.playing .wave-bar:nth-child(2)  { animation-duration:.65s; animation-delay:.10s; }
    .waveform.playing .wave-bar:nth-child(3)  { animation-duration:.90s; animation-delay:.05s; }
    .waveform.playing .wave-bar:nth-child(4)  { animation-duration:.72s; animation-delay:.20s; }
    .waveform.playing .wave-bar:nth-child(5)  { animation-duration:.85s; animation-delay:.15s; }
    .waveform.playing .wave-bar:nth-child(6)  { animation-duration:.70s; animation-delay:.08s; }
    .waveform.playing .wave-bar:nth-child(7)  { animation-duration:.95s; animation-delay:.25s; }
    .waveform.playing .wave-bar:nth-child(8)  { animation-duration:.75s; animation-delay:.12s; }
    .waveform.playing .wave-bar:nth-child(9)  { animation-duration:.88s; animation-delay:.18s; }
    .waveform.playing .wave-bar:nth-child(10) { animation-duration:.68s; animation-delay:.22s; }
    .waveform.playing .wave-bar:nth-child(11) { animation-duration:.82s; animation-delay:.06s; }
    .waveform.playing .wave-bar:nth-child(12) { animation-duration:.78s; animation-delay:.14s; }
    .waveform.playing .wave-bar:nth-child(13) { animation-duration:.92s; animation-delay:.09s; }
    .waveform.playing .wave-bar:nth-child(14) { animation-duration:.66s; animation-delay:.19s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50%       { height: 30px; }
    }

    /* ── PLAY BUTTON ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .play-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      background: linear-gradient(145deg, var(--orange-lt) 0%, #902000 100%);
      color: var(--cream);
      font-size: 1.55rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      box-shadow:
        0 0 0 1px #000,
        0 0 24px rgba(217,92,10,0.45),
        0 5px 18px rgba(0,0,0,0.6);
    }

    .play-btn:hover {
      background: linear-gradient(145deg, #ff8040 0%, var(--orange) 100%);
      box-shadow:
        0 0 0 1px #000,
        0 0 34px rgba(217,92,10,0.65),
        0 5px 22px rgba(0,0,0,0.6);
      transform: scale(1.06);
    }

    .play-btn:active { transform: scale(0.96); }

    /* Pause icon via text — shift right slightly for optical center on play */
    .play-btn.state-play  { padding-left: 4px; }
    .play-btn.state-pause { padding-left: 0;   }

    /* ── VOLUME ── */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .speaker-icon {
      font-size: 1rem;
      min-width: 22px;
      text-align: center;
      transition: opacity 0.3s;
    }

    .speaker-icon.dim { opacity: 0.28; }

    input[type=range] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 2px;
      cursor: pointer;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: var(--gold-lt);
      border: 2px solid var(--cream);
      box-shadow: 0 2px 6px rgba(0,0,0,0.55);
      cursor: pointer;
    }

    input[type=range]::-moz-range-thumb {
      width: 15px; height: 15px;
      border-radius: 50%;
      background: var(--gold-lt);
      border: 2px solid var(--cream);
      box-shadow: 0 2px 6px rgba(0,0,0,0.55);
      cursor: pointer;
    }

    .vol-pct {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 38px;
      text-align: right;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    /* ── RATING ── */
    .rating-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rating-label {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      flex: 1;
    }

    .rating-btns {
      display: flex;
      gap: 10px;
    }

    .thumb-btn {
      position: relative;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid var(--dim);
      background: #130800;
      color: var(--muted);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .thumb-btn:hover {
      border-color: var(--gold);
      color: var(--cream);
      transform: scale(1.08);
    }

    .thumb-btn:active { transform: scale(0.94); }

    .thumb-btn.voted-up {
      background: rgba(90,170,40,0.13);
      border-color: var(--green-up);
      color: #7de040;
      box-shadow: 0 0 14px rgba(90,170,40,0.3);
    }

    .thumb-btn.voted-down {
      background: rgba(200,56,32,0.13);
      border-color: var(--red-down);
      color: #f05040;
      box-shadow: 0 0 14px rgba(200,56,32,0.3);
    }

    .vote-count {
      position: absolute;
      top: -6px; right: -6px;
      min-width: 18px; height: 18px;
      border-radius: 9px;
      background: var(--gold);
      color: #100500;
      font-size: 0.58rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .vote-count.show { opacity: 1; }

    /* ── STATUS ── */
    .status-bar {
      text-align: center;
      margin-top: 14px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      min-height: 1em;
      text-transform: uppercase;
    }

    /* ── FOOTER ── */
    .card-footer {
      margin-top: 18px;
      text-align: center;
      font-size: 0.52rem;
      letter-spacing: 0.32em;
      color: var(--dim);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>

  <!-- Station -->
  <div class="station">
    <div class="station-name">Groovy FM</div>
    <div class="station-sub">Billboard Top 100 &bull; The 1970s</div>
  </div>

  <!-- Record + Artist Photo -->
  <div class="media-row">

    <div class="record" id="record">
      <div class="record-label">
        <div class="record-label-text">GROOVY<br>FM</div>
        <div class="record-hole"></div>
      </div>
    </div>

    <div class="artist-photo">
      <!-- Swap the placeholder div for an <img> tag if you have an artist photo URL -->
      <div class="artist-photo-placeholder">
        <div class="artist-initials" id="artistInitials">EW&amp;F</div>
        <div class="artist-photo-sub">Artist</div>
      </div>
    </div>

  </div>

  <!-- Song Info -->
  <div class="song-info">
    <div class="song-title" id="songTitle">September</div>
    <div class="artist-name" id="artistName">Earth, Wind &amp; Fire</div>
    <div class="song-year" id="songYear">&bull;&nbsp;1978&nbsp;&bull;</div>
  </div>

  <div class="divider"></div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
  </div>

  <!-- Play / Pause -->
  <div class="controls">
    <button class="play-btn state-play" id="playBtn" title="Play / Pause">&#9654;</button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span class="speaker-icon" id="speakerIcon">🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    <span class="vol-pct" id="volPct">100%</span>
  </div>

  <div class="divider"></div>

  <!-- Rating -->
  <div class="rating-section">
    <div class="rating-label">Rate this song</div>
    <div class="rating-btns">
      <button class="thumb-btn" id="thumbUp" title="Love it">
        👍
        <span class="vote-count" id="upCount"></span>
      </button>
      <button class="thumb-btn" id="thumbDown" title="Not for me">
        👎
        <span class="vote-count" id="downCount"></span>
      </button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status">Click play to start the groove</div>

  <div class="card-footer">Billboard &bull; Top 100 &bull; 1970 – 1979</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script>
  const STREAM = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';

  const audio     = new Audio();
  const record    = document.getElementById('record');
  const waveform  = document.getElementById('waveform');
  const playBtn   = document.getElementById('playBtn');
  const statusEl  = document.getElementById('status');
  const volSlider = document.getElementById('volSlider');
  const volPct    = document.getElementById('volPct');
  const speakerEl = document.getElementById('speakerIcon');
  const thumbUp   = document.getElementById('thumbUp');
  const thumbDown = document.getElementById('thumbDown');
  const upCount   = document.getElementById('upCount');
  const downCount = document.getElementById('downCount');

  let isPlaying = false;
  let hlsReady  = false;
  let upVotes   = 0;
  let downVotes = 0;
  let userVote  = null; // 'up' | 'down' | null

  // ── HLS INIT ──
  (function initHls() {
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.loadSource(STREAM);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hlsReady = true;
        setStatus('Ready to groove');
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) setStatus('Stream error — retrying…');
      });
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      audio.src = STREAM;
      hlsReady  = true;
      setStatus('Ready to groove');
    } else {
      setStatus('HLS not supported in this browser');
    }
  })();

  // ── PLAY / PAUSE ──
  playBtn.addEventListener('click', () => {
    if (!hlsReady) { setStatus('Loading stream…'); return; }
    if (isPlaying) {
      audio.pause();
      setPlayState(false);
    } else {
      audio.play()
        .then(() => setPlayState(true))
        .catch(() => setStatus('Playback blocked — try again'));
    }
  });

  function setPlayState(playing) {
    isPlaying = playing;
    if (playing) {
      playBtn.innerHTML = '&#9646;&#9646;';
      playBtn.classList.replace('state-play', 'state-pause');
      record.classList.add('spinning');
      waveform.classList.add('playing');
      setStatus('Live &bull; Playing now');
    } else {
      playBtn.innerHTML = '&#9654;';
      playBtn.classList.replace('state-pause', 'state-play');
      record.classList.remove('spinning');
      waveform.classList.remove('playing');
      setStatus('Paused');
    }
  }

  // ── VOLUME ──
  function syncVolume() {
    const v   = parseFloat(volSlider.value);
    const pct = Math.round(v * 100);
    audio.volume = v;
    volPct.textContent = pct + '%';

    // Gradient fill on track
    const filled  = '#d95c0a';
    const unfilled = '#3d2000';
    volSlider.style.background =
      `linear-gradient(90deg, ${filled} ${pct}%, ${unfilled} ${pct}%)`;

    // Speaker icon
    if (pct === 0) {
      speakerEl.textContent = '🔇';
      speakerEl.classList.add('dim');
    } else if (pct < 35) {
      speakerEl.textContent = '🔉';
      speakerEl.classList.add('dim');
    } else {
      speakerEl.textContent = '🔊';
      speakerEl.classList.remove('dim');
    }
  }

  volSlider.addEventListener('input', syncVolume);
  syncVolume(); // set initial state

  // ── RATING ──
  thumbUp.addEventListener('click', () => {
    if (userVote === 'up') {
      // Toggle off
      upVotes--;
      userVote = null;
      thumbUp.classList.remove('voted-up');
    } else {
      if (userVote === 'down') {
        downVotes = Math.max(0, downVotes - 1);
        thumbDown.classList.remove('voted-down');
      }
      upVotes++;
      userVote = 'up';
      thumbUp.classList.add('voted-up');
    }
    renderVotes();
  });

  thumbDown.addEventListener('click', () => {
    if (userVote === 'down') {
      downVotes--;
      userVote = null;
      thumbDown.classList.remove('voted-down');
    } else {
      if (userVote === 'up') {
        upVotes = Math.max(0, upVotes - 1);
        thumbUp.classList.remove('voted-up');
      }
      downVotes++;
      userVote = 'down';
      thumbDown.classList.add('voted-down');
    }
    renderVotes();
  });

  function renderVotes() {
    upCount.textContent   = upVotes;
    downCount.textContent = downVotes;
    upCount.classList.toggle('show',   upVotes   > 0);
    downCount.classList.toggle('show', downVotes > 0);
  }

  // ── STATUS ──
  function setStatus(msg) { statusEl.innerHTML = msg; }
</script>

</body>
</html>
