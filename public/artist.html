<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Profile | Billboard Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ── */
    :root {
      --bg:           #0a0a0f;
      --surface:      #13131a;
      --surface2:     #1c1c26;
      --surface3:     #252535;
      --gold:         #d4a017;
      --gold-lt:      #e8c547;
      --gold-glow:    rgba(212,160,23,.14);
      --text:         #f0f0f5;
      --text-muted:   #7a7a8e;
      --text-dim:     #4a4a5e;
      --border:       rgba(255,255,255,.07);
      --border-gold:  rgba(212,160,23,.28);
      --green:        #4ade80;
      --blue:         #60a5fa;
      --radius:       12px;
      --radius-sm:    8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ────────────────── HEADER ────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 32px;
      background: rgba(10,10,15,.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .18s, color .18s;
      white-space: nowrap;
    }
    .back-btn:hover { border-color: var(--gold); color: var(--gold); }

    .header-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .header-spacer { flex: 1; }

    .decade-badge {
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--gold-glow);
      border: 1px solid var(--border-gold);
      color: var(--gold-lt);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    /* ────────────────── HERO ────────────────── */
    .hero {
      position: relative;
      min-height: 300px;
      display: flex;
      align-items: flex-end;
      padding: 64px 32px 40px;
      overflow: hidden;
    }

    .hero-bg-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, #1a0a2e 0%, #0a0a0f 50%, #061a1a 100%);
    }

    .hero-bg-art {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      filter: blur(40px);
      transition: opacity .5s ease;
    }
    .hero-bg-art.ready { opacity: .18; }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 0%, transparent 65%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 28px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero-art {
      width: 148px;
      height: 148px;
      border-radius: var(--radius);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      box-shadow: 0 12px 48px rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-art-initials {
      font-size: 40px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -1px;
      line-height: 1;
    }

    .hero-text { flex: 1; min-width: 0; }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .hero-name {
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.05;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-song-line {
      font-size: 16px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-song-name { font-style: italic; }

    .year-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      background: var(--gold-glow);
      border: 1px solid var(--border-gold);
      color: var(--gold);
      font-style: normal;
      font-size: 13px;
      font-weight: 600;
    }

    /* ────────────────── MAIN ────────────────── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* ── Loading state ── */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      color: var(--text-muted);
      font-size: 14px;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ────────────────── STAT CARDS ────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 14px 16px;
      text-align: center;
      transition: border-color .18s, transform .15s;
    }
    .stat-card:hover { border-color: var(--border-gold); transform: translateY(-1px); }

    .stat-num {
      font-size: 38px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 7px;
      font-variant-numeric: tabular-nums;
    }
    .stat-num.sm { font-size: 26px; }

    .stat-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ────────────────── TWO-COL ────────────────── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 36px;
    }
    @media (max-width: 680px) { .two-col { grid-template-columns: 1fr; } }

    /* ────────────────── PANEL ────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
    }

    .panel-body { padding: 18px; }

    /* ── Song stats rows ── */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-key { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
    .info-val { font-size: 13px; font-weight: 600; text-align: right; }

    /* ── Peak badge ── */
    .pos-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .pos-1   { background: rgba(212,160,23,.15); color: var(--gold);  border: 1px solid var(--border-gold); }
    .pos-5   { background: rgba(74,222,128,.09); color: var(--green); border: 1px solid rgba(74,222,128,.2); }
    .pos-10  { background: rgba(96,165,250,.09); color: var(--blue);  border: 1px solid rgba(96,165,250,.2); }
    .pos-any { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

    /* ── Star flag ── */
    .star-flag { color: var(--gold); font-size: 12px; margin-left: 4px; }

    /* ── Biography ── */
    .bio-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-muted);
    }

    .bio-source {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .bio-source a { color: var(--gold); text-decoration: none; }
    .bio-source a:hover { text-decoration: underline; }

    /* ── Highlights row ── */
    .highlight-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }

    .hl-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .hl-card:hover { border-color: var(--border-gold); }

    .hl-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .hl-song {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hl-meta { font-size: 12px; color: var(--text-muted); }

    /* ────────────────── SECTION HEADER ────────────────── */
    .section-hd {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-hd-text {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .section-hd-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ────────────────── HISTORY TABLE ────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 36px;
    }

    .ht {
      width: 100%;
      border-collapse: collapse;
    }

    .ht thead th {
      padding: 11px 14px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      text-align: left;
      background: var(--surface2);
    }

    .ht tbody tr { transition: background .12s; }
    .ht tbody tr:hover { background: rgba(255,255,255,.02); }
    .ht tbody tr.selected { background: rgba(212,160,23,.04); }

    .ht tbody td {
      padding: 11px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .ht tbody tr:last-child td { border-bottom: none; }

    /* rank badge */
    .rk {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
    }
    .rk-1   { background: rgba(212,160,23,.2);  color: var(--gold);  }
    .rk-5   { background: rgba(74,222,128,.1);  color: var(--green); }
    .rk-10  { background: rgba(96,165,250,.1);  color: var(--blue);  }
    .rk-any { background: var(--surface2);      color: var(--text-muted); }

    .song-cell { font-weight: 500; max-width: 260px; }
    .song-cell.cur { color: var(--gold); }

    .cur-tag {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      margin-left: 6px;
    }

    .yr-chip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 6px;
      background: var(--surface2);
      font-size: 11px;
      color: var(--text-muted);
      margin: 1px 2px 1px 0;
    }

    .riaa-chip {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 6px;
      background: rgba(74,222,128,.07);
      border: 1px solid rgba(74,222,128,.15);
      font-size: 11px;
      color: var(--green);
    }

    /* ────────────────── RESPONSIVE ────────────────── */
    @media (max-width: 580px) {
      .header         { padding: 12px 16px; }
      .hero           { padding: 40px 16px 28px; }
      .hero-content   { flex-direction: column; align-items: flex-start; gap: 14px; }
      .hero-art       { width: 90px; height: 90px; }
      .hero-name      { font-size: 28px; white-space: normal; }
      .main           { padding: 24px 16px 60px; }
      .stats-row      { grid-template-columns: repeat(3, 1fr); }
      .ht tbody td    { font-size: 12px; padding: 9px 10px; }
      .ht thead th    { padding: 9px 10px; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <a class="back-btn" href="javascript:history.back()">&#8592; Back</a>
  <span class="header-brand">Billboard Radio</span>
  <span class="header-spacer"></span>
  <span class="decade-badge" id="decadeBadge"></span>
</header>

<!-- ── Hero ── -->
<div class="hero">
  <div class="hero-bg-base"></div>
  <div class="hero-bg-art" id="heroBgArt"></div>
  <div class="hero-gradient"></div>
  <div class="hero-content">
    <div class="hero-art" id="heroArt">
      <div class="hero-art-initials" id="heroInitials"></div>
    </div>
    <div class="hero-text">
      <div class="hero-eyebrow">Artist Profile</div>
      <div class="hero-name"  id="heroArtist"></div>
      <div class="hero-song-line" id="heroSongLine"></div>
    </div>
  </div>
</div>

<!-- ── Main ── -->
<main class="main" id="main">
  <div class="loading-screen">
    <div class="spinner"></div>
    Loading profile…
  </div>
</main>

<script>
// ── URL params ──────────────────────────────────────
const params = new URLSearchParams(location.search);
const ARTIST = (params.get('artist') || '').trim();
const SONG   = (params.get('song')   || '').trim();
const YEAR   = (params.get('year')   || '').trim();

// ── Helpers ─────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Mirror the server-side normSong: strip trailing subtitle before comparing.
// Lets "Two Steps Behind" match "Two Steps Behind (From \"Last Action Hero\")".
function normTitle(s) {
  const stripped = s.replace(/\s*\([^)]*\)\s*$/, '').trim() || s;
  return stripped.toLowerCase().replace(/[^a-z0-9]+/g, '');
}

function initials(name) {
  return name.replace(/[^a-zA-Z\s]/g,'')
    .split(/\s+/).filter(Boolean)
    .map(w => w[0].toUpperCase()).slice(0,2).join('');
}

function decadeOf(yr) {
  const y = parseInt(yr,10);
  return y ? `The ${Math.floor(y/10)*10}s` : '';
}

function rankBadgeClass(pos) {
  if (pos === 1)  return 'rk rk-1';
  if (pos <= 5)   return 'rk rk-5';
  if (pos <= 10)  return 'rk rk-10';
  return 'rk rk-any';
}

function posBadge(pos) {
  if (!pos) return `<span class="pos-badge pos-any">—</span>`;
  let cls, label;
  if (pos === 1)  { cls = 'pos-1';  label = '&#127942; #1'; }
  else if (pos <= 5)  { cls = 'pos-5';  label = `#${pos}`; }
  else if (pos <= 10) { cls = 'pos-10'; label = `#${pos}`; }
  else            { cls = 'pos-any'; label = `#${pos}`; }
  return `<span class="pos-badge ${cls}">${label}</span>`;
}

// ── Render header immediately ────────────────────────
document.title = ARTIST ? `${ARTIST} | Billboard` : 'Artist Profile | Billboard';
document.getElementById('heroArtist').textContent  = ARTIST;
document.getElementById('heroInitials').textContent = initials(ARTIST);
if (YEAR) document.getElementById('decadeBadge').textContent = decadeOf(YEAR);

if (SONG) {
  document.getElementById('heroSongLine').innerHTML =
    `<span class="hero-song-name">"${esc(SONG)}"</span>` +
    (YEAR ? `<span class="year-pill">${esc(YEAR)}</span>` : '');
}

// ── Album art ───────────────────────────────────────
const artSrc = `/api/albumart?artist=${encodeURIComponent(ARTIST)}&year=${encodeURIComponent(YEAR)}`;
const probe  = new Image();
probe.onload = () => {
  document.getElementById('heroArt').innerHTML =
    `<img src="${artSrc}" alt="${esc(ARTIST)}">`;
  const bg = document.getElementById('heroBgArt');
  bg.style.backgroundImage = `url(${artSrc})`;
  requestAnimationFrame(() => bg.classList.add('ready'));
};
probe.src = artSrc;

// ── Wikipedia: try bare name, then music-specific suffixes ──────────────────
// Needed for artists like "Prince" or "The Band" where the bare name returns
// a disambiguation page or a non-music article (e.g. royalty, a common noun).
const MUSIC_RE = /musician|singer|songwriter|rapper|band|group|producer|vocalist|rock|pop|r&b|soul|jazz|country|composer|guitarist|drummer/i;

function fetchWiki(name) {
  const tries = [name, name + ' (musician)', name + ' (singer)', name + ' (band)', name + ' (rapper)'];
  function attempt(i) {
    if (i >= tries.length) return Promise.resolve(null);
    return fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(tries[i])}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data || data.type === 'disambiguation') return attempt(i + 1);
        const text = (data.description || '') + ' ' + (data.extract || '').slice(0, 300);
        // On the first (bare name) try, reject if it doesn't look like a music article
        if (i === 0 && !MUSIC_RE.test(text)) return attempt(i + 1);
        return data;
      })
      .catch(() => attempt(i + 1));
  }
  return attempt(0);
}

// ── Fetch chart data + Wikipedia ────────────────────
Promise.all([
  fetch(`/api/artist-stats?artist=${encodeURIComponent(ARTIST)}`).then(r=>r.json()).catch(()=>null),
  fetch(`/api/song-stats?artist=${encodeURIComponent(ARTIST)}&song=${encodeURIComponent(SONG)}`).then(r=>r.json()).catch(()=>null),
  fetchWiki(ARTIST)
]).then(([stats, songData, wiki]) => render(stats, songData, wiki));

// ── Render ───────────────────────────────────────────
function render(stats, songData, wiki) {
  const main = document.getElementById('main');

  if (!stats || !stats.found) {
    main.innerHTML = `
      <div style="text-align:center;padding:80px 32px;">
        <div style="font-size:36px;margin-bottom:12px;">&#127925;</div>
        <h2 style="color:var(--gold);margin-bottom:8px;">Artist Not Found</h2>
        <p style="color:var(--text-muted);">No chart data for "${esc(ARTIST)}".</p>
      </div>`;
    return;
  }

  const {
    totalSingles, top10, top5, top1,
    highestSingle, lowestSingle, longestRunning,
    firstYear, lastYear, allSongs
  } = stats;

  // ── Stat cards ──────────────────────────────────────
  const chartYears = (stats.allYears && stats.allYears.length)
    ? stats.allYears
    : (firstYear ? [firstYear] : []);

  const statCardsHtml = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">${totalSingles}</div>
        <div class="stat-lbl">Charted<br>Singles</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${top10}</div>
        <div class="stat-lbl">Top 10<br>Hits</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${top5}</div>
        <div class="stat-lbl">Top 5<br>Hits</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${top1}</div>
        <div class="stat-lbl">Number<br>One Hits</div>
      </div>
      <div class="stat-card">
        <div class="stat-num sm">#${highestSingle ? highestSingle.bestPosition : '—'}</div>
        <div class="stat-lbl">Best Chart<br>Position</div>
      </div>
      <div class="stat-card">
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-bottom:8px;">
          ${chartYears.map(y => `<span style="font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--surface3);color:var(--gold-lt);font-variant-numeric:tabular-nums;">${y}</span>`).join('')}
        </div>
        <div class="stat-lbl">Years on<br>Chart</div>
      </div>
    </div>`;

  // ── Highlights ──────────────────────────────────────
  const hlCards = [
    highestSingle && {
      label: 'Highest Charting Single',
      song:  highestSingle.song,
      meta:  (() => {
        const base = `Peak #${highestSingle.bestPosition}`;
        const from = highestSingle.firstDate ? highestSingle.firstDate.replace(/\s+\d+,/, '') : null;
        const to   = highestSingle.lastDate  ? highestSingle.lastDate.replace(/\s+\d+,/, '')  : null;
        return from && to && from !== to ? `${base} · ${from} – ${to}` : from ? `${base} · ${from}` : base;
      })()
    },
    lowestSingle && lowestSingle.song !== highestSingle.song && {
      label: 'Lowest Charting Single',
      song:  lowestSingle.song,
      meta:  (() => {
        const from = lowestSingle.firstDate ? lowestSingle.firstDate.replace(/\s+\d+,/, '') : null;
        const to   = lowestSingle.lastDate  ? lowestSingle.lastDate.replace(/\s+\d+,/, '')  : null;
        const range = from && to && from !== to ? `${from} – ${to}` : from || null;
        return range
          ? `Charted ${range}, peaked at #${lowestSingle.bestPosition}`
          : `Peaked at #${lowestSingle.bestPosition}`;
      })()
    },
    longestRunning && longestRunning.totalWeeks > 1 && {
      label: 'Longest Running Single',
      song:  longestRunning.song,
      meta:  (() => {
        const wks  = `${longestRunning.totalWeeks} weeks`;
        const from = longestRunning.firstDate ? longestRunning.firstDate.replace(/\s+\d+,/, '') : null;
        const to   = longestRunning.lastDate  ? longestRunning.lastDate.replace(/\s+\d+,/, '')  : null;
        return from && to && from !== to ? `${wks} · ${from} – ${to}` : wks;
      })()
    }
  ].filter(Boolean);

  const hlHtml = hlCards.length ? `
    <div class="section-hd">
      <span class="section-hd-text">Highlights</span>
      <span class="section-hd-line"></span>
    </div>
    <div class="highlight-row">
      ${hlCards.map(c => `
        <div class="hl-card">
          <div class="hl-label">${esc(c.label)}</div>
          <div class="hl-song" title="${esc(c.song)}">${esc(c.song)}</div>
          <div class="hl-meta">${esc(c.meta)}</div>
        </div>`).join('')}
    </div>` : '';

  // ── Song stats panel ────────────────────────────────
  const sd = songData && songData.found ? songData : null;
  const songPeak = sd ? sd.peakPosition
    : (allSongs.find(s => normTitle(s.song) === normTitle(SONG)) || {}).bestPosition || null;

  const isHighest = highestSingle  && normTitle(highestSingle.song)  === normTitle(SONG);
  const isLongest = longestRunning && normTitle(longestRunning.song)  === normTitle(SONG);

  const songPanelHtml = SONG ? `
    <div class="panel">
      <div class="panel-head">
        <span class="panel-dot"></span>
        <span class="panel-title">Selected Song</span>
      </div>
      <div class="panel-body">
        <div class="info-row">
          <span class="info-key">Song</span>
          <span class="info-val" style="font-style:italic;">${esc(SONG)}</span>
        </div>
        <div class="info-row">
          <span class="info-key">Year</span>
          <span class="info-val">${YEAR || '—'}</span>
        </div>
        <div class="info-row">
          <span class="info-key">Peak Chart Position</span>
          <span class="info-val">${posBadge(songPeak)}</span>
        </div>
        <div class="info-row">
          <span class="info-key">Date First Charted</span>
          <span class="info-val">${sd ? (sd.firstDate || sd.firstYear) : (YEAR || '—')}</span>
        </div>
        <div class="info-row">
          <span class="info-key">Total Weeks on Chart</span>
          <span class="info-val">${sd ? sd.totalWeeks : '—'}</span>
        </div>
        ${isHighest ? `
        <div class="info-row">
          <span class="info-key">Artist's Best Charting Song</span>
          <span class="info-val" style="color:var(--gold);">&#9733; peaked at #${highestSingle.bestPosition}</span>
        </div>` : ''}
        ${isLongest ? `
        <div class="info-row">
          <span class="info-key">Artist's Longest Running Song</span>
          <span class="info-val" style="color:var(--gold);">&#9733; ${longestRunning.totalWeeks} weeks on chart</span>
        </div>` : ''}
      </div>
    </div>` : '';

  // ── Biography panel ──────────────────────────────────
  let bioBody;
  if (wiki && wiki.extract) {
    const text = wiki.extract.length > 700
      ? wiki.extract.slice(0, 700).replace(/\s+\S+$/, '') + '…'
      : wiki.extract;
    const wikiLink = wiki.content_urls && wiki.content_urls.desktop
      ? wiki.content_urls.desktop.page : '#';
    bioBody = `
      <p class="bio-text">${esc(text)}</p>
      <p class="bio-source">Source: <a href="${wikiLink}" target="_blank" rel="noopener noreferrer">Wikipedia</a></p>`;
  } else {
    bioBody = `<p class="bio-text" style="font-style:italic;font-size:13px;">
      No biography available for this artist.</p>`;
  }

  const bioPanelHtml = `
    <div class="panel">
      <div class="panel-head">
        <span class="panel-dot"></span>
        <span class="panel-title">Biography</span>
      </div>
      <div class="panel-body">${bioBody}</div>
    </div>`;

  // ── Chart history ────────────────────────────────────
  const tableRows = allSongs.map(s => {
    const isCur = normTitle(s.song) === normTitle(SONG);
    const rc    = rankBadgeClass(s.bestPosition);
    return `
      <tr class="${isCur ? 'selected' : ''}">
        <td><span class="${rc}">${s.bestPosition}</span></td>
        <td class="song-cell ${isCur ? 'cur' : ''}" title="${esc(s.song)}">
          ${esc(s.song)}${isCur ? '<span class="cur-tag">← selected</span>' : ''}
        </td>
        <td style="font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;">${s.totalWeeks}</td>
        <td>${s.years.map(y => `<span class="yr-chip">${y}</span>`).join('')}</td>
        <td style="font-size:12px;color:var(--text-muted);">${s.firstDate || s.firstYear || '—'}</td>
      </tr>`;
  }).join('');

  const historyHtml = `
    <div class="section-hd">
      <span class="section-hd-text">Full Chart History — ${totalSingles} song${totalSingles !== 1 ? 's' : ''}</span>
      <span class="section-hd-line"></span>
    </div>
    <div class="table-wrap">
      <table class="ht">
        <thead>
          <tr>
            <th>Peak</th>
            <th>Song</th>
            <th>Weeks</th>
            <th>Year(s)</th>
            <th>First Charted</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;

  // ── Assemble ─────────────────────────────────────────
  const twoColHtml = songPanelHtml
    ? `<div class="two-col">${songPanelHtml}${bioPanelHtml}</div>`
    : bioPanelHtml;

  main.innerHTML = statCardsHtml + hlHtml + twoColHtml + historyHtml;
}
</script>
</body>
</html>
